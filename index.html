<title>Karaelma Metronom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: tek sütun, ortada dar bir "cihaz" paneli; tempo büyük, kontroller altta */
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --ink: #1b2230;
    --muted: #657085;
    --line: #d8dce4;
    --brass: #b8860b;
    --brass-soft: #f5e7c4;
    --beat: #3a4d7a;
    --beat-off: #dfe3ea;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #8d97aa; --line: #2c3340;
      --brass: #e2b04a; --brass-soft: #3a3020; --beat: #8fa6dc; --beat-off: #2a313e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #8d97aa; --line: #2c3340;
    --brass: #e2b04a; --brass-soft: #3a3020; --beat: #8fa6dc; --beat-off: #2a313e; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-display);
    display: grid; place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .device {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 24px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 24px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .beats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 28px; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; background: var(--beat-off);
    transition: transform .06s, background .06s;
  }
  .beats.accent .dot.first { box-shadow: inset 0 0 0 2px var(--brass); }
  .dot.on { background: var(--beat); transform: scale(1.25); }
  .beats.accent .dot.first.on { background: var(--brass); }

  .tempo { text-align: center; }
  .bpm { font-family: var(--font-mono); font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
  .bpm-label { color: var(--muted); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; }
  .tempo-name { color: var(--muted); font-size: 14px; margin-top: 2px; font-style: italic; }

  .bpm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 500 22px var(--font-mono); cursor: pointer;
  }
  .round:active { background: var(--beat-off); }
  input[type=range] { width: 100%; accent-color: var(--beat); }

  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .meters button {
    padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 500 16px var(--font-mono); cursor: pointer;
  }
  .meters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .section-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .bell-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-radius: 12px; background: var(--brass-soft); cursor: pointer;
  }
  .bell-toggle span small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 14px; background: var(--beat-off); transition: background .15s; pointer-events: none; }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track { background: var(--brass); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--beat); outline-offset: 2px; }

  .start {
    padding: 16px; border-radius: 14px; border: none; background: var(--beat); color: var(--panel);
    font: 700 18px var(--font-display); cursor: pointer; letter-spacing: .02em;
  }
  .start.running { background: var(--ink); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: -10px 0 0; }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } .dot.on { transform: none; } }
</style>

<main class="device">
  <h1>Karaelma Metronom</h1>

  <div class="beats" id="beats" aria-hidden="true"></div>

  <div class="tempo">
    <div class="bpm" id="bpmView">100</div>
    <div class="bpm-label">vuruş / dakika</div>
    <div class="tempo-name" id="tempoName">Moderato</div>
  </div>

  <div class="bpm-row">
    <button class="round" id="minus" aria-label="Tempoyu 1 azalt">−</button>
    <input type="range" id="bpm" min="30" max="250" value="100" aria-label="Tempo">
    <button class="round" id="plus" aria-label="Tempoyu 1 artır">+</button>
  </div>

  <div>
    <div class="section-label">Ölçü</div>
    <div class="meters" id="meters">
      <button data-beats="2">2/4</button>
      <button data-beats="3">3/4</button>
      <button data-beats="4" aria-pressed="true">4/4</button>
      <button data-beats="5">5/4</button>
      <button data-beats="6">6/8</button>
      <button data-beats="7">7/8</button>
      <button data-beats="9">9/8</button>
      <button data-beats="12">12/8</button>
    </div>
  </div>

  <label class="bell-toggle" for="bell">
    <span>Ölçü başında zil<small>Açıkken ilk vuruş daha tiz tıklar; kapalıyken tüm vuruşlar aynı</small></span>
    <span class="switch"><input type="checkbox" id="bell" checked><span class="track"></span></span>
  </label>

  <button class="start" id="start">Başlat</button>
  <p class="hint">Boşluk: başlat/durdur · ↑↓ tempo ±1 · Shift+↑↓ ±10</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { bpm: 100, beats: 4, bell: true, running: false };

  try {
    const saved = JSON.parse(localStorage.getItem("metronom") || "{}");
    Object.assign(state, saved, { running: false });
  } catch (e) {}
  const save = () => { try { localStorage.setItem("metronom", JSON.stringify({ bpm: state.bpm, beats: state.beats, bell: state.bell })); } catch (e) {} };

  let ctx = null, nextTime = 0, beatIndex = 0, timer = null;
  const LOOKAHEAD = 0.1; // saniye

  function click(t, strong) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square";
    o.frequency.value = strong ? 1600 : 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(strong ? 0.35 : 0.25, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + 0.05);
  }

  function schedule() {
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      click(nextTime, beatIndex === 0 && state.bell);
      const i = beatIndex, delay = Math.max(0, (nextTime - ctx.currentTime) * 1000);
      setTimeout(() => flash(i), delay);
      nextTime += 60 / state.bpm;
      beatIndex = (beatIndex + 1) % state.beats;
    }
  }

  function flash(i) {
    if (!state.running) return;
    const dots = $("beats").children;
    for (const d of dots) d.classList.remove("on");
    if (dots[i]) dots[i].classList.add("on");
  }

  function start() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    state.running = true; beatIndex = 0; nextTime = ctx.currentTime + 0.05;
    schedule(); timer = setInterval(schedule, 25);
    $("start").textContent = "Durdur"; $("start").classList.add("running");
  }
  function stop() {
    state.running = false; clearInterval(timer);
    for (const d of $("beats").children) d.classList.remove("on");
    $("start").textContent = "Başlat"; $("start").classList.remove("running");
  }

  const names = [[40, "Grave"], [60, "Largo"], [66, "Larghetto"], [76, "Adagio"], [108, "Andante"], [120, "Moderato"], [156, "Allegro"], [176, "Vivace"], [200, "Presto"], [999, "Prestissimo"]];
  function setBpm(v) {
    state.bpm = Math.min(250, Math.max(30, Math.round(v)));
    $("bpm").value = state.bpm; $("bpmView").textContent = state.bpm;
    $("tempoName").textContent = names.find(([max]) => state.bpm < max)[1];
    save();
  }
  function setBeats(n) {
    state.beats = n;
    if (beatIndex >= n) beatIndex = 0;
    $("beats").innerHTML = Array.from({ length: n }, (_, i) => `<div class="dot${i === 0 ? " first" : ""}"></div>`).join("");
    for (const b of $("meters").children) b.setAttribute("aria-pressed", String(+b.dataset.beats === n));
    save();
  }

  $("bpm").addEventListener("input", e => setBpm(+e.target.value));
  $("minus").onclick = () => setBpm(state.bpm - 1);
  $("plus").onclick = () => setBpm(state.bpm + 1);
  $("meters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setBeats(+b.dataset.beats); });
  const setBell = on => { state.bell = on; $("beats").classList.toggle("accent", on); save(); };
  $("bell").addEventListener("change", e => setBell(e.target.checked));
  $("start").onclick = () => state.running ? stop() : start();
  document.addEventListener("keydown", e => {
    if (e.target.matches("input[type=range]") && e.key.startsWith("Arrow")) return;
    if (e.code === "Space") { e.preventDefault(); state.running ? stop() : start(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setBpm(state.bpm + (e.shiftKey ? 10 : 1)); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setBpm(state.bpm - (e.shiftKey ? 10 : 1)); }
  });

  $("bell").checked = state.bell;
  setBell(state.bell);
  setBpm(state.bpm);
  setBeats(state.beats);
})();
</script>
