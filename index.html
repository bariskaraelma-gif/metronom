<style>
  /* Layout: tek sütun, ortada dar bir "cihaz" paneli; tempo büyük, kontroller altta */
  :root {
    --bg: #eef0f3;
    --panel: #ffffff;
    --ink: #1b2230;
    --muted: #657085;
    --line: #d8dce4;
    --brass: #b8860b;
    --brass-soft: #f5e7c4;
    --beat: #3a4d7a;
    --beat-off: #dfe3ea;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #8d97aa; --line: #2c3340;
      --brass: #e2b04a; --brass-soft: #3a3020; --beat: #8fa6dc; --beat-off: #2a313e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --panel: #1b2029; --ink: #e8ebf1; --muted: #8d97aa; --line: #2c3340;
    --brass: #e2b04a; --brass-soft: #3a3020; --beat: #8fa6dc; --beat-off: #2a313e; color-scheme: dark;
  }
  html {
    height: 100%; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  body {
    height: 100%; margin: 0;
    background: var(--bg); color: var(--ink); font-family: var(--font-display);
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    display: grid; place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .device {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 28px 24px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 24px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  [hidden] { display: none !important; }
  .lang { position: relative; display: flex; align-items: center; gap: 6px; }
  .lang-label { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
  .lang button {
    display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer;
  }
  .lang-current::after { content: ""; border: 4px solid transparent; border-top-color: currentColor; margin: 4px 2px 0; }
  .lang-current[aria-expanded="true"]::after { border-top-color: transparent; border-bottom-color: currentColor; margin: 0 2px 4px; }
  .lang-menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 5;
    display: flex; flex-direction: column; gap: 4px;
    padding: 4px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(0,0,0,.15);
  }
  .lang-menu button { border-color: transparent; }
  .lang-menu button:hover { background: var(--beat-off); }
  .lang svg { display: block; border-radius: 2px; }
  .beats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 28px; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%; background: var(--beat-off);
    transition: transform .06s, background .06s;
  }
  .beats.accent .dot.first { box-shadow: inset 0 0 0 2px var(--brass); }
  .dot.on { background: var(--beat); transform: scale(1.25); }
  .beats.accent .dot.first.on { background: var(--brass); }

  .tempo { text-align: center; }
  .bpm { font-family: var(--font-mono); font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
  .bpm-label { color: var(--muted); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; }
  .tempo-name { color: var(--muted); font-size: 14px; margin-top: 2px; font-style: italic; }
  .bpm-view {
    border: 0; background: none; color: inherit; padding: 0 6px; cursor: text;
    border-bottom: 2px dashed transparent; border-radius: 0;
  }
  .bpm-view:hover { border-bottom-color: var(--line); }
  .bpm-view.tapped { color: var(--brass); }
  .bpm-input {
    width: 3.4ch; padding: 0 6px; text-align: center; color: var(--ink); background: none;
    border: 0; border-bottom: 2px solid var(--beat); border-radius: 0; outline: none;
  }
  .tap-tip { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 1.3em; }
  .tap-tip.active { color: var(--brass); font-weight: 500; }

  .bpm-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 500 22px var(--font-mono); cursor: pointer;
  }
  .round:active { background: var(--beat-off); }
  input[type=range] { width: 100%; accent-color: var(--beat); }

  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .meters button {
    padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 500 16px var(--font-mono); cursor: pointer;
  }
  .meters button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .meters.sounds { grid-template-columns: repeat(3, 1fr); }
  .meters.sounds button { font: 500 15px var(--font-display); }
  .section-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

  .bell-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-radius: 12px; background: var(--brass-soft); cursor: pointer;
  }
  .bell-toggle span small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; border-radius: 14px; background: var(--beat-off); transition: background .15s; pointer-events: none; }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track { background: var(--brass); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--beat); outline-offset: 2px; }

  .start {
    padding: 16px; border-radius: 14px; border: none; background: var(--beat); color: var(--panel);
    font: 700 18px var(--font-display); cursor: pointer; letter-spacing: .02em;
  }
  .start.running { background: var(--ink); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: -10px 0 0; }
  button, .bell-toggle { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } .dot.on { transform: none; } }

  /* Telefon, dik ekran: panel tüm ekranı kaplar, aralıklar ekran yüksekliğine göre küçülür */
  @media (max-width: 520px) {
    body { display: block; padding: 0; }
    .device {
      max-width: none; min-height: 100%; border: 0; border-radius: 0;
      padding-block: clamp(12px, 2.5dvh, 24px);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      gap: clamp(8px, 2dvh, 20px); justify-content: space-between;
    }
    .bpm { font-size: clamp(52px, 11dvh, 88px); }
    .meters button { padding-block: clamp(7px, 1.4dvh, 12px); }
    .section-label { margin-bottom: 6px; }
    .bell-toggle { padding: 10px 14px; }
    .start { padding-block: clamp(12px, 2.2dvh, 18px); }
  }
  @media (max-width: 520px) and (max-height: 700px) {
    .bell-toggle span small, .tempo-name { display: none; }
    .bpm-label { margin-top: 2px; }
    .tap-tip { margin-top: 2px; font-size: 11px; }
    .dot { width: 18px; height: 18px; }
  }
  @media (max-width: 520px) and (max-height: 600px) {
    h1 { visibility: hidden; }
    .device { gap: 6px; }
    .top { justify-content: flex-end; }
    .lang button { padding: 2px; }
    .lang svg { width: 26px; height: 17px; }
    .bpm { font-size: 46px; }
    .bpm-label { margin-top: 2px; }
    .round { width: 38px; height: 38px; }
    .meters button { padding-block: 6px; }
    .section-label { margin-bottom: 4px; }
  }
  @media (hover: none) { .hint { display: none; } }
</style>
</head>
<body>

<main class="device">
  <div class="top">
    <h1>Metronom</h1>
    <div class="lang">
      <span class="lang-label" id="langLabel">Language:</span>
      <button class="lang-current" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-labelledby="langLabel langBtn"></button>
      <div class="lang-menu" id="langMenu" hidden></div>
    </div>
    <template id="flagTpl">
      <button data-lang="tr" aria-label="Türkçe" title="Türkçe">
        <svg viewBox="0 0 30 20" width="30" height="20" aria-hidden="true">
          <rect width="30" height="20" fill="#E30A17"/>
          <circle cx="11.25" cy="10" r="5" fill="#fff"/>
          <circle cx="12.5" cy="10" r="4" fill="#E30A17"/>
          <polygon fill="#fff" points="14.1,10 15.83,9.44 15.83,7.62 16.9,9.09 18.62,8.53 17.56,10 18.62,11.47 16.9,10.91 15.83,12.38 15.83,10.56"/>
        </svg>
      </button>
      <button data-lang="en" aria-label="English" title="English">
        <svg viewBox="0 0 60 30" width="30" height="20" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <rect width="60" height="30" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
        </svg>
      </button>
    </template>
  </div>

  <div class="beats" id="beats" aria-hidden="true"></div>

  <div class="tempo">
    <button class="bpm bpm-view" id="bpmView" data-i18n-aria="editBpm" aria-label="Tempoyu yaz">100</button>
    <input class="bpm bpm-input" id="bpmInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3"
           enterkeyhint="done" autocomplete="off" data-i18n-aria="editBpm" aria-label="Tempoyu yaz" hidden>
    <div class="bpm-label" data-i18n="bpmLabel">vuruş / dakika</div>
    <div class="tempo-name" id="tempoName">Moderato</div>
    <div class="tap-tip" id="tapTip" data-i18n="tapTip" aria-live="polite">Hızı belirlemek için boş bir yere ritimle dokun</div>
  </div>

  <div class="bpm-row">
    <button class="round" id="minus" data-i18n-aria="minus" aria-label="Tempoyu 1 azalt">−</button>
    <input type="range" id="bpm" min="30" max="250" value="100" aria-label="Tempo">
    <button class="round" id="plus" data-i18n-aria="plus" aria-label="Tempoyu 1 artır">+</button>
  </div>

  <div>
    <div class="section-label" data-i18n="meter">Ölçü</div>
    <div class="meters" id="meters">
      <button data-beats="2">2/4</button>
      <button data-beats="3">3/4</button>
      <button data-beats="4" aria-pressed="true">4/4</button>
      <button data-beats="5">5/4</button>
      <button data-beats="6">6/8</button>
      <button data-beats="7">7/8</button>
      <button data-beats="9">9/8</button>
      <button data-beats="12">12/8</button>
    </div>
  </div>

  <div>
    <div class="section-label"><label for="volume" data-i18n="volume">Ses</label></div>
    <input type="range" id="volume" min="0" max="100" value="90">
  </div>

  <div>
    <div class="section-label" data-i18n="sound">Tık sesi</div>
    <div class="meters sounds" id="sounds">
      <button data-sound="tahta" data-i18n="tahta">Tahta</button>
      <button data-sound="klave" data-i18n="klave" aria-pressed="true">Klave</button>
      <button data-sound="yumusak" data-i18n="yumusak">Yumuşak</button>
    </div>
  </div>

  <label class="bell-toggle" for="bell">
    <span><span data-i18n="bell">Ölçü başında zil</span><small data-i18n="bellNote">Açıkken ilk vuruş daha tiz tıklar; kapalıyken tüm vuruşlar aynı</small></span>
    <span class="switch"><input type="checkbox" id="bell" checked><span class="track"></span></span>
  </label>

  <button class="start" id="start">Başlat</button>
  <p class="hint" data-i18n="hint">Boşluk: başlat/durdur · ↑↓ tempo ±1 · Shift+↑↓ ±10 · T: ritimle vur</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { bpm: 100, beats: 4, bell: true, volume: 90, sound: "klave", lang: "tr", running: false };

  try {
    const saved = JSON.parse(localStorage.getItem("metronom") || "{}");
    Object.assign(state, saved, { running: false });
  } catch (e) {}
  const save = () => { try { localStorage.setItem("metronom", JSON.stringify({ bpm: state.bpm, beats: state.beats, bell: state.bell, volume: state.volume, sound: state.sound, lang: state.lang })); } catch (e) {} };

  let ctx = null, master = null, noise = null, nextTime = 0, beatIndex = 0, timer = null;
  const LOOKAHEAD = 0.1; // saniye

  function setupAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.connect(ctx.destination);
    applyVolume();
    // Tıkın "tahta" vuruş hissi için kısa beyaz gürültü
    noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.03), ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const applyVolume = () => { if (master) master.gain.value = state.volume / 100; };

  function click(t, strong) {
    ({ tahta, klave, yumusak })[state.sound](t, strong);
  }

  // Tahta blok: Klave'den daha pes ve uzun çınlayan, perdesi kaymayan kısmiler + vuruş gürültüsü
  function tahta(t, strong) {
    const f = strong ? 900 : 650;
    for (const [ratio, amp, dur] of [[1, 0.55, 0.08], [2.1, 0.22, 0.035], [3.6, 0.1, 0.018]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f * ratio;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.001);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + dur + 0.01);
    }
    const n = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), ng = ctx.createGain();
    n.buffer = noise;
    bp.type = "bandpass"; bp.frequency.value = 2500; bp.Q.value = 0.8;
    ng.gain.setValueAtTime(0.35, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.006);
    n.connect(bp).connect(ng).connect(master);
    n.start(t);
  }

  // Klave: perdesi kaymayan, hızla sönen birkaç uyumsuz kısmi + çok kısa vuruş gürültüsü
  function klave(t, strong) {
    const f = strong ? 1400 : 950;
    for (const [ratio, amp, dur] of [[1, 0.6, 0.05], [2.57, 0.25, 0.03], [4.2, 0.12, 0.015]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f * ratio;
      g.gain.setValueAtTime(amp, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + dur + 0.01);
    }
    const n = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), ng = ctx.createGain();
    n.buffer = noise;
    hp.type = "highpass"; hp.frequency.value = 2000;
    ng.gain.setValueAtTime(0.25, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.005);
    n.connect(hp).connect(ng).connect(master);
    n.start(t);
  }

  // Yumuşak: tek, saf ve kısa bir ton
  function yumusak(t, strong) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = strong ? 1000 : 700;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.07);
  }

  function schedule() {
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      click(nextTime, beatIndex === 0 && state.bell);
      const i = beatIndex, delay = Math.max(0, (nextTime - ctx.currentTime) * 1000);
      setTimeout(() => flash(i), delay);
      nextTime += 60 / state.bpm;
      beatIndex = (beatIndex + 1) % state.beats;
    }
  }

  function flash(i) {
    if (!state.running) return;
    const dots = $("beats").children;
    for (const d of dots) d.classList.remove("on");
    if (dots[i]) dots[i].classList.add("on");
  }

  // iPhone'da sessiz modu anahtarı Web Audio'yu susturur. Ses oturumunu "playback" yapınca
  // (iOS 16.4+) ya da arkada sessiz bir <audio> çalınca (eski iOS) ses yine duyulur.
  let silentAudio = null;
  function silentWavUrl() {
    const n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, "data"); v.setUint32(40, n, true);
    new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  // Sessiz <audio> aynı zamanda sayfayı bir "medya oynatıcı" yapar: kilit ekranı, Apple Watch
  // "Şimdi Çalıyor" ve klavye medya tuşları onu görür ve oynat/duraklat gönderir.
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    if (!ctx) setupAudio();
    if (!silentAudio) {
      silentAudio = new Audio(silentWavUrl());
      silentAudio.loop = true;
      silentAudio.setAttribute("playsinline", "");
    }
    silentAudio.play().catch(() => {});
    if (ctx.state !== "running") ctx.resume();
  }

  // Apple Watch / kilit ekranı kontrolleri
  let artwork = null;
  function artworkUrl() {
    if (artwork) return artwork;
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = "#3a4d7a"; g.fillRect(0, 0, 256, 256);
    g.fillStyle = "#ffffff";
    g.beginPath(); g.moveTo(88, 210); g.lineTo(168, 210); g.lineTo(144, 52); g.lineTo(112, 52); g.closePath(); g.fill();
    g.strokeStyle = "#e2b04a"; g.lineWidth = 12; g.lineCap = "round";
    g.beginPath(); g.moveTo(128, 186); g.lineTo(168, 78); g.stroke();
    return (artwork = c.toDataURL("image/png"));
  }
  function updateMedia() {
    if (!("mediaSession" in navigator)) return;
    try {
      const meter = $("meters").querySelector(`[data-beats="${state.beats}"]`).textContent;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Metronom", artist: `${state.bpm} BPM · ${meter}`, album: "Karaelma Metronom",
        artwork: [{ src: artworkUrl(), sizes: "256x256", type: "image/png" }]
      });
      navigator.mediaSession.playbackState = state.running ? "playing" : "paused";
    } catch (e) {}
  }
  if ("mediaSession" in navigator) {
    const on = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {} };
    on("play", () => { if (!state.running) start(); });
    on("pause", () => { if (state.running) stop(); });
    on("stop", () => { if (state.running) stop(); });
    // Saat/kulaklıktaki ileri-geri tuşları tempoyu 5 değiştirir
    on("nexttrack", () => setBpm(state.bpm + 5));
    on("previoustrack", () => setBpm(state.bpm - 5));
  }

  function start() {
    unlockAudio();
    state.running = true; beatIndex = 0; nextTime = ctx.currentTime + 0.05;
    schedule(); timer = setInterval(schedule, 25);
    $("start").textContent = t("stop"); $("start").classList.add("running");
    updateMedia();
  }
  function stop() {
    state.running = false; clearInterval(timer);
    if (silentAudio) silentAudio.pause();
    for (const d of $("beats").children) d.classList.remove("on");
    $("start").textContent = t("start"); $("start").classList.remove("running");
    updateMedia();
  }

  const texts = {
    tr: {
      bpmLabel: "vuruş / dakika", meter: "Ölçü", volume: "Ses", sound: "Tık sesi",
      tahta: "Tahta", klave: "Klave", yumusak: "Yumuşak",
      bell: "Ölçü başında zil", bellNote: "Açıkken ilk vuruş daha tiz tıklar; kapalıyken tüm vuruşlar aynı",
      start: "Başlat", stop: "Durdur", hint: "Boşluk: başlat/durdur · ↑↓ tempo ±1 · Shift+↑↓ ±10 · T: ritimle vur",
      minus: "Tempoyu 1 azalt", plus: "Tempoyu 1 artır", editBpm: "Tempoyu yaz",
      tapTip: "Hızı belirlemek için boş bir yere ritimle dokun", tapCount: "{n}. dokunuş"
    },
    en: {
      bpmLabel: "beats / minute", meter: "Time signature", volume: "Volume", sound: "Click sound",
      tahta: "Woodblock", klave: "Clave", yumusak: "Soft",
      bell: "Accent on beat one", bellNote: "On: the first beat clicks higher; off: all beats sound the same",
      start: "Start", stop: "Stop", hint: "Space: start/stop · ↑↓ tempo ±1 · Shift+↑↓ ±10 · T: tap tempo",
      minus: "Decrease tempo by 1", plus: "Increase tempo by 1", editBpm: "Type the tempo",
      tapTip: "Tap an empty spot in rhythm to set the tempo", tapCount: "Tap {n}"
    }
  };
  const t = key => texts[state.lang][key];
  function setLang(lang) {
    state.lang = texts[lang] ? lang : "tr";
    document.documentElement.lang = state.lang;
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", t(el.dataset.i18nAria));
    $("start").textContent = t(state.running ? "stop" : "start");
    renderLangMenu();
    save();
  }

  // Dil menüsü: kapalıyken yalnızca seçili bayrak görünür, tıklayınca diğer diller altta açılır
  const flagFor = lang => $("flagTpl").content.querySelector(`[data-lang="${lang}"]`);
  function renderLangMenu() {
    const cur = flagFor(state.lang);
    $("langBtn").innerHTML = cur.innerHTML;
    $("langBtn").title = cur.title;
    $("langMenu").replaceChildren(...Object.keys(texts).filter(l => l !== state.lang).map(l => flagFor(l).cloneNode(true)));
  }
  function toggleLangMenu(open) {
    $("langMenu").hidden = !open;
    $("langBtn").setAttribute("aria-expanded", String(open));
  }
  $("langBtn").addEventListener("click", e => { e.stopPropagation(); toggleLangMenu($("langMenu").hidden); });
  $("langMenu").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    toggleLangMenu(false); setLang(b.dataset.lang); $("langBtn").focus();
  });
  document.addEventListener("click", e => { if (!e.target.closest(".lang")) toggleLangMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") toggleLangMenu(false); });

  const names = [[40, "Grave"], [60, "Largo"], [66, "Larghetto"], [76, "Adagio"], [108, "Andante"], [120, "Moderato"], [156, "Allegro"], [176, "Vivace"], [200, "Presto"], [999, "Prestissimo"]];
  function setBpm(v) {
    state.bpm = Math.min(250, Math.max(30, Math.round(v)));
    $("bpm").value = state.bpm; $("bpmView").textContent = state.bpm;
    $("tempoName").textContent = names.find(([max]) => state.bpm < max)[1];
    if (silentAudio) updateMedia();
    save();
  }
  function setBeats(n) {
    state.beats = n;
    if (beatIndex >= n) beatIndex = 0;
    $("beats").innerHTML = Array.from({ length: n }, (_, i) => `<div class="dot${i === 0 ? " first" : ""}"></div>`).join("");
    for (const b of $("meters").children) b.setAttribute("aria-pressed", String(+b.dataset.beats === n));
    if (silentAudio) updateMedia();
    save();
  }

  $("bpm").addEventListener("input", e => setBpm(+e.target.value));
  $("minus").onclick = () => setBpm(state.bpm - 1);
  $("plus").onclick = () => setBpm(state.bpm + 1);
  $("meters").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setBeats(+b.dataset.beats); });
  const setBell = on => { state.bell = on; $("beats").classList.toggle("accent", on); save(); };
  $("bell").addEventListener("change", e => setBell(e.target.checked));
  $("start").onclick = () => state.running ? stop() : start();
  // Tempo rakamına tıklayınca yazarak girme (telefonda rakam klavyesi açılır)
  function editBpm() {
    $("bpmInput").value = state.bpm;
    $("bpmView").hidden = true; $("bpmInput").hidden = false;
    $("bpmInput").focus(); $("bpmInput").select();
  }
  function closeBpmEdit(commit) {
    if ($("bpmInput").hidden) return;
    const v = parseInt($("bpmInput").value, 10);
    if (commit && v > 0) setBpm(v);
    $("bpmInput").hidden = true; $("bpmView").hidden = false;
  }
  $("bpmView").addEventListener("click", editBpm);
  $("bpmInput").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3); });
  $("bpmInput").addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); closeBpmEdit(true); $("bpmView").focus(); }
    else if (e.key === "Escape") { closeBpmEdit(false); $("bpmView").focus(); }
  });
  $("bpmInput").addEventListener("blur", () => closeBpmEdit(true));

  // Ritimle dokunarak tempo: boş bir yere (ya da T tuşuna) art arda vurulunca aralıkların ortalaması alınır
  let taps = [], tapResetTimer = null;
  function tap() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 8) taps.shift();
    if (taps.length >= 2) {
      const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
      setBpm(60000 / avg);
    }
    $("tapTip").textContent = t("tapCount").replace("{n}", taps.length);
    $("tapTip").classList.add("active");
    $("bpmView").classList.add("tapped");
    clearTimeout(tapResetTimer);
    tapResetTimer = setTimeout(() => {
      taps = [];
      $("tapTip").textContent = t("tapTip"); $("tapTip").classList.remove("active");
      $("bpmView").classList.remove("tapped");
    }, 2000);
  }
  document.addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    if (e.target.closest("button, input, label, select, a, .lang, .bell-toggle")) return;
    if (!$("bpmInput").hidden) return;
    tap();
  });

  document.addEventListener("keydown", e => {
    if (e.target.matches("input[type=range]") && e.key.startsWith("Arrow")) return;
    if ((e.key === "t" || e.key === "T") && !e.ctrlKey && !e.metaKey && !e.altKey) { tap(); return; }
    if (e.code === "Space") { e.preventDefault(); state.running ? stop() : start(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setBpm(state.bpm + (e.shiftKey ? 10 : 1)); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setBpm(state.bpm - (e.shiftKey ? 10 : 1)); }
  });

  $("volume").addEventListener("input", e => { state.volume = +e.target.value; applyVolume(); save(); });
  $("volume").value = state.volume;
  const setSound = s => {
    state.sound = s;
    for (const b of $("sounds").children) b.setAttribute("aria-pressed", String(b.dataset.sound === s));
    save();
  };
  $("sounds").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    setSound(b.dataset.sound);
    // Durmuşken seçilirse sesi bir kez çalarak dinlet
    if (!state.running) { unlockAudio(); click(ctx.currentTime + 0.05, false); }
  });
  if (!["tahta", "klave", "yumusak"].includes(state.sound)) state.sound = "klave";
  setSound(state.sound);
  $("bell").checked = state.bell;
  setBell(state.bell);
  setLang(state.lang);
  setBpm(state.bpm);
  setBeats(state.beats);
})();
</script>
</body>
</html>
